name: gabarite_cfc
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.1
  supabase_flutter: ^2.9.1
  get_it: ^9.0.5
  connectivity_plus: ^7.0.0
  shimmer: ^3.0.0
  equatable: ^2.0.7
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  scrollable_positioned_list: ^0.3.8
  build_runner: ^2.6.0
  mockito: ^5.5.0
  google_sign_in: ^7.1.1
  flutter_localizations:
    sdk: flutter
  # web: ^1.1.1
  faker: ^2.2.0
  bloc_test: ^10.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

scripts:
  test_with_statusbar: "flutter test && dart run lib/script.dart"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fixtures/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
        - asset: assets/fonts/roboto/Roboto-ExtraLight.ttf
        - asset: assets/fonts/roboto/Roboto-ExtraLightItalic.ttf
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
        - asset: assets/fonts/roboto/Roboto-Light.ttf
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
        - asset: assets/fonts/roboto/Roboto-Thin.ttf
    


